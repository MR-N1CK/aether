name: Feature request
description: A detection, report, or workflow gap you want Aether to cover.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard to assess today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should Aether do?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: How does this stay read-only?
      description: Note if the idea would execute a file, write to the target, or open a network connection.
    validations:
      required: true
