name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  # Core gate: build, vet, format, full unit suite, race detector.
  test:
    name: Build & Test (pure Go)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./... -timeout 20m

      - name: Race detector (short)
        run: go test -race -short ./internal/scanner/ ./internal/modules/... ./internal/report/...

  # Detection accuracy contract: zero false positives on benign corpus,
  # >= 95% recall on malicious corpus, determinism, regression locks.
  benchmark:
    name: Detection Accuracy Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Benchmark contract suite
        run: go test -v ./test/benchmark/... -timeout 10m

  # Real-world simulation profiles (desktop, server, container-host,
  # pentest workstation, ...). Requires gcc for compiled benign fixtures.
  realworld:
    name: Real-World Validation Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install cc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Real-world profiles
        run: go test ./test/realworld/... -timeout 20m

  # Packaging integrity (deb/rpm contents, man pages, systemd units).
  packaging:
    name: Packaging Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Packaging tests
        run: go test ./test/packaging/... -timeout 10m

  # YARA-X engine build (cgo + Rust toolchain) and tagged rule tests,
  # including the benign-corpus zero-ALERT gate.
  yara:
    name: YARA-X Engine Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: YARA-X tagged tests
        run: go test -tags yara ./internal/yara/... -timeout 20m
