<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Aether — Read-only Linux threat hunting and endpoint compromise assessment engine">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#E0FEFF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#16203A" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#164E63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="880" height="230" fill="#0B1220"/>
  <rect width="880" height="230" fill="url(#grid)"/>
  <rect width="880" height="230" fill="url(#glow)"/>

  <!-- ambient wave, bottom -->
  <path d="M0 196 C 140 168, 260 214, 420 190 S 700 150, 880 178 L 880 230 L 0 230 Z" fill="url(#wave)"/>
  <path d="M0 210 C 180 186, 340 222, 520 200 S 780 176, 880 196 L 880 230 L 0 230 Z"
        fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.4"/>

  <!-- version + license chips -->
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif">
    <rect x="672" y="26" width="74" height="22" rx="11" fill="#101828" stroke="#24334F"/>
    <text x="709" y="41" text-anchor="middle" font-size="11" fill="#8CA0B8" letter-spacing="1">v1.1.0</text>
    <rect x="754" y="26" width="104" height="22" rx="11" fill="#101828" stroke="#24334F"/>
    <text x="806" y="41" text-anchor="middle" font-size="11" fill="#8CA0B8" letter-spacing="1">APACHE-2.0</text>

    <!-- corner diamond, echoing the TUI's glyph language -->
    <path d="M 34 34 L 40 40 L 34 46 L 28 40 Z" fill="#22D3EE" fill-opacity="0.85"/>

    <text x="440" y="96" text-anchor="middle" font-size="54" font-weight="bold"
          fill="url(#wordmark)" letter-spacing="14">AETHER</text>

    <rect x="284" y="116" width="312" height="1.2" fill="#24334F"/>
    <text x="440" y="146" text-anchor="middle" font-size="15.5" fill="#C9D6E8"
          letter-spacing="4.2">READ-ONLY LINUX THREAT HUNTING</text>
    <text x="440" y="172" text-anchor="middle" font-size="12.5" fill="#8CA0B8">
      zero sample execution · zero timestamp mutation · zero outbound telemetry</text>
  </g>
</svg>
