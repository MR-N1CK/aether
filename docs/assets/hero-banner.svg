<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Aether — Read-Only Linux Threat Hunting &amp; Incident Response Engine">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Wordmark Luminous Gradient -->
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Subtle Cyan Accent Glow -->
    <radialGradient id="auroraGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyberdeck Micro Grid -->
    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#17223b" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- Linear Radar Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Corner Crosshairs -->
    <g id="crosshair">
      <path d="M-6 0 L6 0 M0 -6 L0 6" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    </g>

    <style>
      .pulse-dot {
        animation: pulseDot 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 14px 12px;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
      .sweep-beam {
        animation: beamMove 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes beamMove {
        0% { transform: translateX(-150px); opacity: 0; }
        15% { opacity: 0.35; }
        85% { opacity: 0.35; }
        100% { transform: translateX(1000px); opacity: 0; }
      }
      .wordmark-glow {
        animation: wordmarkPulse 4s ease-in-out infinite alternate;
      }
      @keyframes wordmarkPulse {
        0% { filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.25)); }
        100% { filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.55)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-dot, .sweep-beam, .wordmark-glow {
          animation: none !important;
          transform: none !important;
          filter: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="880" height="240" rx="8" fill="url(#bgGrad)"/>
  <rect width="880" height="240" rx="8" fill="url(#cyberGrid)"/>
  <rect width="880" height="240" rx="8" fill="url(#auroraGlow)"/>

  <!-- Radar Sweep Scanline -->
  <rect x="0" y="0" width="120" height="240" fill="url(#beamGrad)" class="sweep-beam" pointer-events="none"/>

  <!-- Crisp Border Frame -->
  <rect width="880" height="240" rx="8" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Tactical HUD Corner Reticles -->
  <use href="#crosshair" x="24" y="24"/>
  <use href="#crosshair" x="856" y="24"/>
  <use href="#crosshair" x="24" y="216"/>
  <use href="#crosshair" x="856" y="216"/>

  <!-- Left Telemetry Rail Indicator -->
  <line x1="24" y1="52" x2="24" y2="188" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="24" cy="52" r="3" fill="#38bdf8"/>
  <circle cx="24" cy="188" r="3" fill="#38bdf8"/>

  <!-- Right Telemetry Status Pill -->
  <g transform="translate(680, 24)">
    <rect width="176" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#34d399" class="pulse-dot"/>
    <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">READ-ONLY AUDIT</text>
  </g>

  <!-- Center Branding -->
  <g text-anchor="middle">
    <!-- Subtitle Flag -->
    <text x="440" y="56" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#38bdf8" letter-spacing="3.5">
      FORENSIC INCIDENT RESPONSE &amp; THREAT HUNTING
    </text>

    <!-- Main Wordmark with Luminous Filter -->
    <g class="wordmark-glow">
      <text x="440" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="url(#wordmarkGrad)" letter-spacing="16">
        AETHER
      </text>
    </g>

    <!-- Horizontal Divider -->
    <line x1="260" y1="138" x2="620" y2="138" stroke="#1e293b" stroke-width="1.2"/>
    <polygon points="440,135 444,138 440,141 436,138" fill="#38bdf8"/>

    <!-- Primary Value Tagline -->
    <text x="440" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="500" fill="#e2e8f0" letter-spacing="0.8">
      Air-Gapped Compromise Assessment Engine for Linux Endpoints
    </text>

    <!-- Technical Guarantee Triad -->
    <text x="440" y="196" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="500" fill="#7888a3" letter-spacing="0.5">
      <tspan fill="#34d399">✓</tspan> ZERO SAMPLE EXECUTION &nbsp;·&nbsp; 
      <tspan fill="#34d399">✓</tspan> ZERO TIMESTAMP MUTATION (O_NOATIME) &nbsp;·&nbsp; 
      <tspan fill="#34d399">✓</tspan> ZERO OUTBOUND TELEMETRY
    </text>
  </g>
</svg>
