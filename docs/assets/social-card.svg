<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Aether: Read-Only Linux Compromise Assessment &amp; Threat Hunter">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="60%" stop-color="#09101E"/>
      <stop offset="100%" stop-color="#0E192D"/>
    </linearGradient>

    <!-- Aurora Glows -->
    <radialGradient id="auroraTopRight" cx="80%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0E7490" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraBottomLeft" cx="20%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0E7490" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo and Brand Gradients -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F0FDFF"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0E7490" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.06"/>
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Void Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  
  <!-- Aurora Light Splashes -->
  <rect width="1280" height="640" fill="url(#auroraTopRight)"/>
  <rect width="1280" height="640" fill="url(#auroraBottomLeft)"/>

  <!-- Cyber Grid -->
  <rect width="1280" height="640" fill="url(#gridPattern)"/>

  <!-- Top Accent Rail -->
  <rect width="1280" height="3" fill="url(#logoGrad)"/>

  <!-- Cockpit HUD Card Frame -->
  <g transform="translate(680, 110)">
    <!-- Ambient Shadow -->
    <rect width="520" height="420" rx="20" fill="#04070F" opacity="0.85" filter="url(#glowEffect)"/>
    <!-- Card Surface -->
    <rect width="520" height="420" rx="20" fill="#0A1120" stroke="url(#cardBorder)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="520" height="46" rx="20" fill="#060B16" opacity="0.9"/>
    <rect y="26" width="520" height="20" fill="#060B16" opacity="0.9"/>
    <line x1="0" y1="46" x2="520" y2="46" stroke="#24334F" stroke-width="1"/>
    
    <!-- Dots -->
    <circle cx="28" cy="23" r="5.5" fill="#FF5F56"/>
    <circle cx="48" cy="23" r="5.5" fill="#FFBD2E"/>
    <circle cx="68" cy="23" r="5.5" fill="#27C93F"/>
    <text x="100" y="28" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="1">AETHER FLIGHT DECK • LIVE SCAN</text>
    <rect x="420" y="14" width="75" height="20" rx="4" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="432" y="28" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">60 FPS</text>

    <!-- Cockpit Module Telemetry -->
    <g transform="translate(24, 70)">
      <!-- Module 1 -->
      <rect width="472" height="46" rx="8" fill="#101C33" stroke="#24334F" stroke-width="1"/>
      <circle cx="24" cy="23" r="4" fill="#34D399"/>
      <text x="40" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Process Hunter</text>
      <text x="390" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CLEAN</text>

      <!-- Module 2 (Alert) -->
      <g transform="translate(0, 56)">
        <rect width="472" height="46" rx="8" fill="#101C33" stroke="#F43F5E" stroke-width="1.2"/>
        <circle cx="24" cy="23" r="4" fill="#F43F5E"/>
        <text x="40" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Persistence Audit</text>
        <rect x="365" y="12" width="90" height="22" rx="4" fill="#F43F5E" fill-opacity="0.18" stroke="#F43F5E" stroke-opacity="0.5"/>
        <text x="375" y="27" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ALERT [95]</text>
      </g>

      <!-- Module 3 -->
      <g transform="translate(0, 112)">
        <rect width="472" height="46" rx="8" fill="#101C33" stroke="#24334F" stroke-width="1"/>
        <circle cx="24" cy="23" r="4" fill="#34D399"/>
        <text x="40" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Privilege &amp; Accounts</text>
        <text x="390" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CLEAN</text>
      </g>

      <!-- Module 4 (Notice) -->
      <g transform="translate(0, 168)">
        <rect width="472" height="46" rx="8" fill="#101C33" stroke="#38BDF8" stroke-width="1"/>
        <circle cx="24" cy="23" r="4" fill="#38BDF8"/>
        <text x="40" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Network Inode Mapping</text>
        <rect x="365" y="12" width="90" height="22" rx="4" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-opacity="0.5"/>
        <text x="373" y="27" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">NOTICE [35]</text>
      </g>

      <!-- Module 5 -->
      <g transform="translate(0, 224)">
        <rect width="472" height="46" rx="8" fill="#101C33" stroke="#24334F" stroke-width="1"/>
        <circle cx="24" cy="23" r="4" fill="#34D399"/>
        <text x="40" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Kernel Module Integrity</text>
        <text x="390" y="28" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CLEAN</text>
      </g>
    </g>

    <!-- Verdict Banner in Cockpit -->
    <g transform="translate(24, 360)">
      <rect width="472" height="40" rx="8" fill="#060B16" stroke="#24334F" stroke-width="1"/>
      <text x="16" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">HOST VERDICT:</text>
      <text x="110" y="25" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">🚨 ATTENTION (1 ALERT, 1 NOTICE)</text>
    </g>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 110)">
    <!-- Brand Kicker Capsule -->
    <rect width="270" height="32" rx="16" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.3"/>
    <circle cx="16" cy="16" r="4" fill="#22D3EE"/>
    <text x="28" y="21" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">LINUX THREAT HUNTING</text>

    <!-- Brand Title -->
    <g transform="translate(0, 100)">
      <!-- Geometric Logo Badge -->
      <rect width="64" height="64" rx="18" fill="#0A1120" stroke="#22D3EE" stroke-width="2" filter="url(#glowEffect)"/>
      <path d="M16 46 L32 18 L48 46" fill="none" stroke="#22D3EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 46 H42" stroke="#F0FDFF" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Title Typography -->
      <text x="84" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="800" letter-spacing="-1">AETHER</text>
    </g>

    <!-- Tagline & Description -->
    <text x="0" y="200" fill="#E0FEFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700">Read-Only Linux Compromise Assessment.</text>
    <text x="0" y="235" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="18">Know if the endpoint is clean without mutating evidentiary state.</text>

    <!-- Key Badges Cluster -->
    <g transform="translate(0, 275)">
      <!-- Badge 1: Static Only -->
      <g>
        <rect width="130" height="32" rx="8" fill="#101C33" stroke="#24334F" stroke-width="1"/>
        <text x="14" y="21" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">🛡️ 100% STATIC</text>
      </g>
      <!-- Badge 2: O_NOATIME -->
      <g transform="translate(142, 0)">
        <rect width="130" height="32" rx="8" fill="#101C33" stroke="#24334F" stroke-width="1"/>
        <text x="14" y="21" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">⚡ O_NOATIME</text>
      </g>
      <!-- Badge 3: Dual YARA-X -->
      <g transform="translate(284, 0)">
        <rect width="125" height="32" rx="8" fill="#101C33" stroke="#24334F" stroke-width="1"/>
        <text x="14" y="21" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">🎯 YARA-X DUAL</text>
      </g>
    </g>

    <!-- Target Audit Scope Matrix -->
    <g transform="translate(0, 345)">
      <text x="0" y="0" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">SURFACE TRIAGE SCOPE:</text>
      <text x="0" y="26" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">
        Processes • Persistence • Accounts • Sockets • Kernel • Files
      </text>
    </g>

    <!-- Invariants Guarantee Banner -->
    <g transform="translate(0, 420)">
      <rect width="490" height="44" rx="10" fill="#04070F" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.3"/>
      <text x="18" y="27" fill="#F0FDFF" font-family="'Inter', sans-serif" font-size="13" font-weight="600">
        ✓ No sample execution &nbsp;•&nbsp; ✓ Zero outbound telemetry &nbsp;•&nbsp; ✓ MITRE ATT&amp;CK
      </text>
    </g>
  </g>
</svg>
